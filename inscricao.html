<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscrição — Preparatório OAB | SpaceJur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--panel:#100f0d;--ink:#f3efe8;--mute:#a59f93;--gold:#d9a441;--gold2:#f0c673;--line:#2a2418}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,system-ui,sans-serif;background:radial-gradient(700px 400px at 100% 0%,rgba(217,164,65,.2),transparent 70%),radial-gradient(600px 400px at 0% 100%,rgba(217,164,65,.12),transparent 70%),var(--bg);color:var(--ink);line-height:1.7;font-weight:300;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:40px 22px 60px}
.logo{display:block;width:min(420px,100%);margin:0 auto 34px;mix-blend-mode:screen}
.eyebrow{text-align:center;font-size:.7rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:12px}
h1{text-align:center;font-weight:300;font-size:1.25rem;letter-spacing:.26em;text-transform:uppercase;line-height:1.6}
.gift{margin:26px 0 30px;border:1px solid var(--gold);padding:18px 22px;text-align:center}
.gift b{display:block;font-weight:500;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);line-height:1.8}
.gift span{font-size:.85rem;color:var(--mute)}
form{background:var(--panel);border:1px solid var(--line);padding:32px 28px;position:relative}
form::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
label{display:block;font-size:.64rem;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:var(--mute);margin:16px 0 6px}
label:first-of-type{margin-top:0}
input,select{width:100%;padding:13px 14px;font:300 .95rem Montserrat;border:1px solid var(--line);background:#080807;color:var(--ink);border-radius:0}
select option{background:#080807}
input:focus,select:focus{outline:none;border-color:var(--gold)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:20px;font-size:.78rem;color:var(--mute);letter-spacing:0;text-transform:none;font-weight:300}
.check input{width:auto;margin-top:5px}
button{width:100%;margin-top:24px;padding:16px;font:600 .72rem Montserrat;letter-spacing:.26em;text-transform:uppercase;background:var(--gold);color:#0a0a0a;border:1px solid var(--gold);cursor:pointer;transition:.2s}
button:hover{background:var(--gold2)}
.ok{display:none;text-align:center;padding:30px 6px;color:var(--mute)}
.ok b{display:block;font-weight:400;letter-spacing:.24em;text-transform:uppercase;font-size:.9rem;color:var(--gold2);margin-bottom:10px}
.foot{text-align:center;margin-top:30px;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="logo.jpg" alt="SpaceJur — Hub Jurídico">
  <div class="eyebrow">Inscrições abertas</div>
  <h1>Preparatório OAB</h1>

  <div class="gift"><b>Os 100 primeiros inscritos ganham um Vade Mecum</b><span>Preencha seus dados e garanta sua vaga.</span></div>

  <form id="f">
    <div id="fields">
      <label for="nome">Nome completo</label>
      <input id="nome" name="nome" required autocomplete="name">

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required autocomplete="email">

      <label for="whats">WhatsApp</label>
      <input id="whats" name="whatsapp" type="tel" required placeholder="(00) 00000-0000" autocomplete="tel">

      <label for="sit">Situação atual</label>
      <select id="sit" name="situacao" required>
        <option value="">Selecione</option>
        <option>Estudante de Direito</option>
        <option>Bacharel em Direito</option>
        <option>Já fui aprovado na 1ª fase da OAB</option>
        <option>Advogado(a)</option>
        <option>Outro</option>
      </select>

      <label for="fase">Em qual fase você quer se preparar?</label>
      <select id="fase" name="fase" required>
        <option value="">Selecione</option>
        <option>1ª fase</option>
        <option>2ª fase</option>
        <option>Mentoria</option>
        <option>Ainda não sei</option>
      </select>

      <label class="check"><input type="checkbox" required> Autorizo o contato por WhatsApp e e-mail e o uso dos meus dados para esta inscrição, conforme a LGPD.</label>
      <button type="submit">Quero minha vaga</button>
    </div>
    <div class="ok" id="ok"><b>Inscrição recebida</b>Em breve entraremos em contato pelo WhatsApp.</div>
  </form>
  <div class="foot">Conhecimento que impulsiona sua carreira</div>
</div>
<script>
// Troque pelo endpoint do CRM (POST JSON). Sem endpoint, só simula o envio.
const CRM_ENDPOINT = "";
document.getElementById('f').addEventListener('submit', async e=>{
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  if(CRM_ENDPOINT){
    try{ await fetch(CRM_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); }catch(_){}
  }
  document.getElementById('fields').style.display='none';
  document.getElementById('ok').style.display='block';
});
</script>
</body>
</html>
